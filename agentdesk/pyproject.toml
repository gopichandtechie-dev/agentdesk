[project]
name = "agentdesk"
version = "0.1.0"
description = "AgentDesk — UC-04 KB ingestion slice"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.118.*",
  "uvicorn[standard]==0.34.*",
  "python-multipart==0.0.18",
  "google-genai==2.8.0",
  "langgraph==1.2.4",
  "psycopg[binary,pool]==3.2.*",
  "pgvector==0.3.*",
  "pypdf==5.1.*",
  "google-cloud-storage==2.18.*",
  "google-cloud-firestore==2.19.*",
  "firebase_admin==6.5.*",
  "tiktoken==0.8.*",
  "pydantic==2.*",
  "pydantic-settings==2.*",
  "langfuse==2.*"
]

[project.optional-dependencies]
dev = [
  "pytest==8.*",
  "pytest-asyncio==0.24.*",
  "httpx==0.27.*",
  "respx==0.21.*",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"